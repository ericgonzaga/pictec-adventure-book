<div class="p-6 max-w-4xl mx-auto space-y-8">
  <h1 class="text-2xl font-bold">Books</h1>

  @if (errorMessage()) {
    <div class="error-msg">
      {{ errorMessage() }}
    </div>
  }

  <form (ngSubmit)="onCreateBook()" class="form">
    <h2 class="text-lg font-semibold">New Book</h2>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium">Difficulty *</label>
        <select [(ngModel)]="newMetadata.difficulty" name="difficulty" required class="input-field">
          @for (diff of difficulties; track diff) {
            <option [value]="diff">{{ diff }}</option>
          }
        </select>
      </div>

      <div>
        <label class="label-field">Category</label>
        <input type="text" [(ngModel)]="newMetadata.category" name="category" placeholder="e.g., fantasy" class="input-field" />
      </div>

      <div>
        <label class="label-field">JSON File *</label>
        <input type="file" accept=".json,application/json" (change)="onFileSelected($event)" required class="input-field" />
      </div>
    </div>

    <div>
      <label class="label-field">Description</label>
      <textarea [(ngModel)]="newMetadata.description" name="description" rows="2" class="input-field"></textarea>
    </div>

    <button type="submit" [disabled]="!selectedFile || loading()" class="confirm-btn">
      {{ loading() ? "Loading..." : "Save Book" }}
    </button>
  </form>

  <div class="flex flex-wrap gap-3 items-end border-t pt-6">
    <div>
      <label class="label-field">Search</label>
      <input type="text" [(ngModel)]="filterQuery" placeholder="Title or author..." class="input-field" />
    </div>
    <div>
      <label class="label-field">Category</label>
      <input type="text" [(ngModel)]="filterCategory" placeholder="Category..." class="input-field" />
    </div>
    <div>
      <label class="label-field">Difficulty</label>
      <select [(ngModel)]="filterDifficulty" class="input-field">
        <option value="">All</option>
        @for (diff of difficulties; track diff) {
          <option [value]="diff">{{ diff }}</option>
        }
      </select>
    </div>
    <button (click)="loadBooks()" class="primary-btn">Filter</button>
  </div>

  <div class="space-y-3">
    @for (book of books(); track book.id) {
      <div class="p-4 border rounded flex justify-between items-center">
        <div>
          <div class="flex items-center gap-2">
            <h3>{{ book.title }}</h3>
            <span class="text-xs px-2 py-0.5 bg-gray-200 rounded">{{ book.difficulty }}</span>
            @if (book.category) {
              <span class="text-xs px-2 py-0.5 bg-blue-100 text-blue-800 rounded">
                {{ book.category }}
              </span>
            }
          </div>
          <p class="text-sm text-gray-600">Author: {{ book.author }}</p>
          @if (book.description) {
            <p class="text-sm mt-1">{{ book.description }}</p>
          }
        </div>

        <div class="flex gap-2">
          <button (click)="onPlayBook(book.id)" class="play-grid-btn">Play</button>
          <button (click)="onDeleteBook(book.id)" class="delete-grid-btn">Delete</button>
        </div>
      </div>
    } @empty {
      <p class="info-msg">No books found.</p>
    }
  </div>
</div>
